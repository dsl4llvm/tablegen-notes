name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install llvm-tblgen (best effort)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq llvm || true
      - name: Run examples
        run: |
          TBLGEN="$(command -v llvm-tblgen || echo llvm-tblgen)" ./verify.sh

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1280" height="620" fill="#F8FAFC"/>

  <text x="56" y="62" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#0F172A">一份定义，两个后端，零份语法副本</text>
  <text x="56" y="96" font-family="Noto Sans CJK SC" font-size="16" fill="#64748B">同一份记录图，被两个互不相识的消费者各读一遍 —— 加第三个的成本是 0</text>

  <!-- 你写的那一格 -->
  <rect x="56" y="150" width="210" height="200" rx="14" fill="#FFFBEB" stroke="#FCD34D" filter="url(#sh)"/>
  <text x="78" y="186" font-family="Noto Sans CJK SC" font-size="13" fill="#B45309">你写的</text>
  <text x="78" y="242" font-family="Noto Sans Mono CJK SC" font-size="26" font-weight="700" fill="#92400E">expr.td</text>
  <text x="78" y="288" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#92400E">87 行</text>
  <text x="78" y="318" font-family="Noto Sans CJK SC" font-size="13" fill="#B45309">语言定义</text>

  <!-- 箭头 1 -->
  <line x1="266" y1="250" x2="366" y2="250" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="316" y="230" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="11" fill="#64748B">llvm-tblgen</text>
  <text x="316" y="274" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="11" fill="#64748B">-dump-json</text>

  <!-- 中间：记录图 -->
  <rect x="372" y="150" width="200" height="200" rx="14" fill="#F1F5F9" stroke="#CBD5E1" filter="url(#sh)"/>
  <text x="394" y="186" font-family="Noto Sans CJK SC" font-size="13" fill="#475569">tblgen 产物</text>
  <text x="394" y="242" font-family="Noto Sans Mono CJK SC" font-size="24" font-weight="700" fill="#0F172A">expr.json</text>
  <text x="394" y="288" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#334155">记录图</text>
  <text x="394" y="318" font-family="Noto Sans CJK SC" font-size="13" fill="#64748B">谁都能读</text>

  <!-- 分叉 -->
  <path d="M572,250 H616 V175 H666" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M572,250 H616 V395 H666" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 后端 A -->
  <rect x="672" y="120" width="246" height="110" rx="12" fill="#EFF6FF" stroke="#BFDBFE" filter="url(#sh)"/>
  <text x="694" y="150" font-family="Noto Sans CJK SC" font-size="13" fill="#1D4ED8">后端 A</text>
  <text x="694" y="188" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#1E3A8A">gen_parser.py</text>
  <text x="694" y="216" font-family="Noto Sans CJK SC" font-size="13" fill="#64748B">47 行 · 只会挑表</text>

  <!-- 后端 B -->
  <rect x="672" y="330" width="246" height="110" rx="12" fill="#EFF6FF" stroke="#BFDBFE" filter="url(#sh)"/>
  <text x="694" y="360" font-family="Noto Sans CJK SC" font-size="13" fill="#1D4ED8">后端 B</text>
  <text x="694" y="398" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#1E3A8A">gen_doc.py</text>
  <text x="694" y="426" font-family="Noto Sans CJK SC" font-size="13" fill="#64748B">42 行 · 只会排版</text>

  <line x1="918" y1="175" x2="958" y2="175" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="918" y1="385" x2="958" y2="385" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 产物 -->
  <rect x="964" y="120" width="260" height="110" rx="12" fill="#FFFFFF" stroke="#BFDBFE" filter="url(#sh)"/>
  <text x="986" y="156" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#0F172A">parser_gen.py</text>
  <text x="986" y="186" font-family="Noto Sans CJK SC" font-size="13" fill="#64748B">解析表 · 24 行</text>
  <text x="986" y="212" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">生成物，手不碰</text>

  <rect x="964" y="330" width="260" height="110" rx="12" fill="#FFFFFF" stroke="#BFDBFE" filter="url(#sh)"/>
  <text x="986" y="366" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#0F172A">GRAMMAR.md</text>
  <text x="986" y="396" font-family="Noto Sans CJK SC" font-size="13" fill="#64748B">语法文档 · 31 行</text>
  <text x="986" y="422" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">生成物，手不碰</text>

  <!-- 底注 -->
  <rect x="56" y="496" width="1168" height="76" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="640" y="528" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#047857">加一个运算符：expr.td +1 行 · 语义表 +1 行 · 引擎与后端 +0 行</text>
  <text x="640" y="556" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="14" fill="#059669">两个后端谁也不知道对方存在，所以它们不可能说两套话</text>
</svg>

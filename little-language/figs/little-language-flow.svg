<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#F8FAFC"/>

  <text x="40" y="52" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#0F172A">一份定义，两个后端，零份语法副本</text>
  <text x="40" y="82" font-family="Noto Sans CJK SC" font-size="15" fill="#64748B">两个后端互不相识，加第三个的成本是 0</text>

  <!-- 你写的 -->
  <rect x="40" y="120" width="180" height="170" rx="14" fill="#FFFBEB" stroke="#FCD34D" filter="url(#sh)"/>
  <text x="62" y="156" font-family="Noto Sans CJK SC" font-size="15" fill="#B45309">你写的</text>
  <text x="62" y="206" font-family="Noto Sans Mono CJK SC" font-size="22" font-weight="700" fill="#92400E">expr.td</text>
  <text x="62" y="252" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#92400E">87 行</text>

  <line x1="220" y1="205" x2="272" y2="205" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 记录图 -->
  <rect x="280" y="120" width="180" height="170" rx="14" fill="#F1F5F9" stroke="#CBD5E1" filter="url(#sh)"/>
  <text x="302" y="156" font-family="Noto Sans Mono CJK SC" font-size="13" fill="#475569">llvm-tblgen 吐出</text>
  <text x="302" y="206" font-family="Noto Sans Mono CJK SC" font-size="20" font-weight="700" fill="#0F172A">expr.json</text>
  <text x="302" y="252" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#334155">记录图</text>

  <path d="M460,205 H510 V175 H562" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M460,205 H510 V325 H562" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 后端 A -->
  <rect x="570" y="110" width="390" height="130" rx="12" fill="#EFF6FF" stroke="#BFDBFE" filter="url(#sh)"/>
  <text x="592" y="142" font-family="Noto Sans CJK SC" font-size="15" fill="#1D4ED8">后端 A · 47 行</text>
  <text x="592" y="182" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#1E3A8A">gen_parser.py</text>
  <text x="770" y="182" font-family="Noto Sans CJK SC" font-size="17" fill="#94A3B8">→</text>
  <text x="800" y="182" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#0F172A">parser_gen.py</text>
  <text x="592" y="214" font-family="Noto Sans CJK SC" font-size="14" fill="#64748B">生成的解析表，24 行，手不碰</text>

  <!-- 后端 B -->
  <rect x="570" y="260" width="390" height="130" rx="12" fill="#EFF6FF" stroke="#BFDBFE" filter="url(#sh)"/>
  <text x="592" y="292" font-family="Noto Sans CJK SC" font-size="15" fill="#1D4ED8">后端 B · 42 行</text>
  <text x="592" y="332" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#1E3A8A">gen_doc.py</text>
  <text x="726" y="332" font-family="Noto Sans CJK SC" font-size="17" fill="#94A3B8">→</text>
  <text x="756" y="332" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#0F172A">GRAMMAR.md</text>
  <text x="592" y="364" font-family="Noto Sans CJK SC" font-size="14" fill="#64748B">生成的语法文档，31 行，手不碰</text>

  <!-- 底注 -->
  <rect x="40" y="424" width="920" height="66" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="500" y="452" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#047857">加一个运算符：td +1 行 · 语义 +1 行 · 引擎与后端 +0 行</text>
  <text x="500" y="476" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="14" fill="#059669">语法只写一遍，读者可以有无数个</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610">
  <defs>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1000" height="610" fill="#F8FAFC"/>

  <text x="30" y="50" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#0F172A">2 ^ 3 ^ 2：一行代码，两棵树</text>
  <text x="30" y="80" font-family="Noto Sans CJK SC" font-size="15" fill="#64748B">结合性写在 td 里；引擎里，它只改了一个 +1</text>

  <!-- 左 -->
  <rect x="30" y="110" width="450" height="360" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh2)"/>
  <text x="52" y="148" font-family="Noto Sans Mono CJK SC" font-size="18" font-weight="700" fill="#1D4ED8">assoc = right</text>
  <text x="52" y="174" font-family="Noto Sans CJK SC" font-size="14" fill="#64748B">expr.td 里写的就是这一行</text>

  <g stroke="#94A3B8" stroke-width="2">
    <line x1="255" y1="254" x2="185" y2="301"/>
    <line x1="255" y1="254" x2="325" y2="301"/>
    <line x1="325" y1="339" x2="285" y2="386"/>
    <line x1="325" y1="339" x2="365" y2="386"/>
  </g>
  <g font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" text-anchor="middle">
    <rect x="219" y="216" width="72" height="38" rx="9" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="255" y="242" fill="#1E3A8A">pow</text>
    <rect x="149" y="301" width="72" height="38" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="185" y="327" fill="#334155">2</text>
    <rect x="289" y="301" width="72" height="38" rx="9" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="325" y="327" fill="#1E3A8A">pow</text>
    <rect x="249" y="386" width="72" height="38" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="285" y="412" fill="#334155">3</text>
    <rect x="329" y="386" width="72" height="38" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="365" y="412" fill="#334155">2</text>
  </g>

  <text x="255" y="524" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1D4ED8">= 512</text>
  <text x="255" y="552" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="15" fill="#64748B">2 ^ (3 ^ 2)</text>

  <!-- 右 -->
  <rect x="520" y="110" width="450" height="360" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh2)"/>
  <text x="542" y="148" font-family="Noto Sans Mono CJK SC" font-size="18" font-weight="700" fill="#B45309">assoc = left</text>
  <text x="542" y="174" font-family="Noto Sans CJK SC" font-size="14" fill="#64748B">把 td 里那个字改成 left，就这样</text>

  <g stroke="#94A3B8" stroke-width="2">
    <line x1="745" y1="254" x2="675" y2="301"/>
    <line x1="745" y1="254" x2="815" y2="301"/>
    <line x1="675" y1="339" x2="635" y2="386"/>
    <line x1="675" y1="339" x2="715" y2="386"/>
  </g>
  <g font-family="Noto Sans Mono CJK SC" font-size="19" font-weight="700" text-anchor="middle">
    <rect x="709" y="216" width="72" height="38" rx="9" fill="#FFFBEB" stroke="#FCD34D"/>
    <text x="745" y="242" fill="#92400E">pow</text>
    <rect x="639" y="301" width="72" height="38" rx="9" fill="#FFFBEB" stroke="#FCD34D"/>
    <text x="675" y="327" fill="#92400E">pow</text>
    <rect x="779" y="301" width="72" height="38" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="815" y="327" fill="#334155">2</text>
    <rect x="599" y="386" width="72" height="38" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="635" y="412" fill="#334155">2</text>
    <rect x="679" y="386" width="72" height="38" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="715" y="412" fill="#334155">3</text>
  </g>

  <text x="745" y="524" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#B45309">= 64</text>
  <text x="745" y="552" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="15" fill="#64748B">((2 ^ 3) ^ 2)</text>

  <text x="500" y="590" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="15" fill="#475569">nxt = prec + 1 if assoc == "left" else prec</text>
</svg>

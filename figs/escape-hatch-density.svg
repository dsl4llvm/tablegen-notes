<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1000" height="620" fill="#F8FAFC"/>

  <text x="40" y="52" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#0F172A">同一门语言，两个子系统，反着用</text>
  <text x="40" y="84" font-family="Noto Sans CJK SC" font-size="16" fill="#64748B">密度 = 每千行出现次数。条形共用一条 0–2 的轴，长度可以直接比。</text>

  <!-- 轴网格 -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="300" y1="112" x2="300" y2="516"/>
    <line x1="460" y1="112" x2="460" y2="516"/>
    <line x1="620" y1="112" x2="620" y2="516"/>
    <line x1="780" y1="112" x2="780" y2="516"/>
    <line x1="940" y1="112" x2="940" y2="516"/>
  </g>

  <!-- 组 1: code -->
  <rect x="40" y="112" width="196" height="30" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="56" y="132" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#B45309">code · 文本逃生舱</text>

  <text x="40" y="196" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#334155">目标描述</text>
  <text x="40" y="218" font-family="Noto Sans CJK SC" font-size="14" fill="#94A3B8">642,026 行</text>
  <rect x="300" y="182" width="11" height="34" rx="3" fill="#F59E0B"/>
  <text x="323" y="206" font-family="Noto Sans Mono CJK SC" font-size="20" font-weight="700" fill="#B45309">0.03</text>

  <text x="40" y="262" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#334155">Clang</text>
  <text x="40" y="284" font-family="Noto Sans CJK SC" font-size="14" fill="#94A3B8">109,673 行</text>
  <rect x="300" y="248" width="282" height="34" rx="3" fill="#F59E0B"/>
  <text x="594" y="272" font-family="Noto Sans Mono CJK SC" font-size="20" font-weight="700" fill="#B45309">0.88</text>

  <!-- 组 2: dag -->
  <rect x="40" y="330" width="196" height="30" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="56" y="350" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#1D4ED8">dag · 结构逃生舱</text>

  <text x="40" y="414" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#334155">目标描述</text>
  <text x="40" y="436" font-family="Noto Sans CJK SC" font-size="14" fill="#94A3B8">642,026 行</text>
  <rect x="300" y="400" width="589" height="34" rx="3" fill="#3B82F6"/>
  <text x="876" y="424" text-anchor="end" font-family="Noto Sans Mono CJK SC" font-size="20" font-weight="700" fill="#FFFFFF">1.84</text>

  <text x="40" y="480" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#334155">Clang</text>
  <text x="40" y="502" font-family="Noto Sans CJK SC" font-size="14" fill="#94A3B8">109,673 行</text>
  <rect x="300" y="466" width="48" height="34" rx="3" fill="#3B82F6"/>
  <text x="360" y="490" font-family="Noto Sans Mono CJK SC" font-size="20" font-weight="700" fill="#1D4ED8">0.15</text>

  <text x="40" y="540" font-family="Noto Sans CJK SC" font-size="14" fill="#94A3B8">个 / 千行</text>
  <!-- 刻度 -->
  <line x1="300" y1="516" x2="940" y2="516" stroke="#CBD5E1" stroke-width="1.5"/>
  <g font-family="Noto Sans Mono CJK SC" font-size="14" fill="#94A3B8" text-anchor="middle">
    <text x="300" y="540">0</text>
    <text x="460" y="540">0.5</text>
    <text x="620" y="540">1.0</text>
    <text x="780" y="540">1.5</text>
    <text x="940" y="540">2.0</text>
  </g>

  <!-- 底注 -->
  <rect x="40" y="558" width="920" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <text x="500" y="584" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#334155">code：Clang 稠 29 倍　　·　　dag：目标描述稠 12 倍</text>
  <text x="500" y="607" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="15" fill="#64748B">两边都没错。同一句「值不值得让机器理解」，两个子系统答了两次，方向相反。</text>
</svg>

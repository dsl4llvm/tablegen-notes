<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
  <rect width="1000" height="480" fill="#F8FAFC"/>
  <text x="40" y="52" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#0F172A">91 万行 td，分在这三处</text>
  <text x="40" y="84" font-family="Noto Sans CJK SC" font-size="16" fill="#64748B">条长按行数；每个色块上方是文件数，块内是行数。</text>

  <rect x="50.0" y="200" width="634.8" height="110" fill="#F59E0B" opacity="0.9"/><text x="367.4" y="262" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#FFFFFF">LLVM</text><text x="367.4" y="292" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="14" fill="#FFFFFF" opacity="0.85">642,026</text><text x="367.4" y="186" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="14" fill="#B45309">600 个文件</text><rect x="684.8" y="200" width="108.4" height="110" fill="#3B82F6" opacity="0.9"/><text x="739.0" y="262" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#FFFFFF">Clang</text><text x="739.0" y="292" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="14" fill="#FFFFFF" opacity="0.85">109,673</text><text x="739.0" y="186" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="14" fill="#1D4ED8">97 个文件</text><rect x="793.2" y="200" width="156.8" height="110" fill="#10B981" opacity="0.9"/><text x="871.6" y="262" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#FFFFFF">MLIR</text><text x="871.6" y="292" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="14" fill="#FFFFFF" opacity="0.85">158,557</text><text x="871.6" y="186" text-anchor="middle" font-family="Noto Sans Mono CJK SC" font-size="14" fill="#047857">344 个文件</text>

  <line x1="50" y1="330" x2="950" y2="330" stroke="#CBD5E1"/>
  <text x="50" y="356" font-family="Noto Sans Mono CJK SC" font-size="14" fill="#475569">合计 1,041 个文件 · 910,256 行 · 195 个 -gen-* 后端</text>

  <g font-family="Noto Sans CJK SC" font-size="15" fill="#334155">
    <text x="50" y="404">LLVM：25 个 target。最深的是调度模型——一颗 CPU 一个文件。</text>
    <text x="50" y="432">Clang：最大的文件是语义诊断，14,523 行，一条指令都没有。</text>
    <text x="50" y="460">MLIR：46 个方言，公用前缀 OpBase.td 只有 774 行。</text>
  </g>
</svg>
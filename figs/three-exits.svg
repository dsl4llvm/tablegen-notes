<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1000" height="780" fill="#F8FAFC"/>
  <text x="40" y="52" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#0F172A">同一个三段式，三种交接物</text>
  <text x="40" y="82" font-family="Noto Sans CJK SC" font-size="16" fill="#64748B">前两段一样，差别全在第三段怎么拿到第二段：递过去的是什么。</text>

  <rect x="40" y="96" width="280" height="34" rx="8" fill="#FFFBEB" stroke="#FCD34D"/><text x="56" y="119" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#B45309">TableGen</text><rect x="40" y="152" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="56" y="176" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">声明式描述</text><text x="56" y="201" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#0F172A">X86.td 等 .td</text><line x1="180.0" y1="218" x2="180.0" y2="230" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="250" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="56" y="274" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">内存模型</text><text x="56" y="299" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#0F172A">RecordKeeper</text><line x1="180.0" y1="316" x2="180.0" y2="328" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="348" width="280" height="62" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/><text x="56" y="372" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">交接物</text><text x="56" y="397" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#B45309">C++ 对象</text><line x1="180.0" y1="414" x2="180.0" y2="426" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="446" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="56" y="470" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">消费者</text><text x="56" y="495" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#0F172A">46 个 -gen-* 后端</text><line x1="40" y1="548" x2="320" y2="548" stroke="#E2E8F0"/><text x="40" y="576" font-family="Noto Sans CJK SC" font-size="15" fill="#475569">扩展 = 往 LLVM 仓库里加一个后端，</text><text x="40" y="602" font-family="Noto Sans CJK SC" font-size="15" fill="#475569">再重新编译整个 tblgen。</text><rect x="360" y="96" width="280" height="34" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/><text x="376" y="119" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#1D4ED8">Protobuf</text><rect x="360" y="152" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="376" y="176" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">声明式描述</text><text x="376" y="201" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#0F172A">.proto</text><line x1="500.0" y1="218" x2="500.0" y2="230" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/><rect x="360" y="250" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="376" y="274" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">内存模型</text><text x="376" y="299" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#0F172A">FileDescriptor</text><line x1="500.0" y1="316" x2="500.0" y2="328" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/><rect x="360" y="348" width="280" height="62" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/><text x="376" y="372" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">交接物</text><text x="376" y="397" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#1D4ED8">序列化消息</text><line x1="500.0" y1="414" x2="500.0" y2="426" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/><rect x="360" y="446" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="376" y="470" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">消费者</text><text x="376" y="495" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#0F172A">任意语言的插件</text><line x1="360" y1="548" x2="640" y2="548" stroke="#E2E8F0"/><text x="360" y="576" font-family="Noto Sans CJK SC" font-size="15" fill="#475569">扩展 = 实现 1 个纯虚函数，</text><text x="360" y="602" font-family="Noto Sans CJK SC" font-size="15" fill="#475569">插件可以住在任何语言里。</text><rect x="680" y="96" width="280" height="34" rx="8" fill="#FFF1F2" stroke="#FECDD3"/><text x="696" y="119" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#BE123C">MLIR ODS</text><rect x="680" y="152" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="696" y="176" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">声明式描述</text><text x="696" y="201" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#0F172A">.td + ODS</text><line x1="820.0" y1="218" x2="820.0" y2="230" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/><rect x="680" y="250" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="696" y="274" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">内存模型</text><text x="696" y="299" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#0F172A">RecordKeeper</text><line x1="820.0" y1="316" x2="820.0" y2="328" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/><rect x="680" y="348" width="280" height="62" rx="10" fill="#FFF1F2" stroke="#FECDD3" stroke-width="2"/><text x="696" y="372" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">交接物</text><text x="696" y="397" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#BE123C">一段字符串</text><line x1="820.0" y1="414" x2="820.0" y2="426" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/><rect x="680" y="446" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="696" y="470" font-family="Noto Sans CJK SC" font-size="13" fill="#94A3B8">消费者</text><text x="696" y="495" font-family="Noto Sans Mono CJK SC" font-size="17" font-weight="700" fill="#0F172A">4,770 行解释器</text><line x1="680" y1="548" x2="960" y2="548" stroke="#E2E8F0"/><text x="680" y="576" font-family="Noto Sans CJK SC" font-size="15" fill="#475569">扩展 = 在 OpFormatGen 里加一段，</text><text x="680" y="602" font-family="Noto Sans CJK SC" font-size="15" fill="#475569">解析器本身只会变长。</text>

  <rect x="40" y="650" width="920" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="500" y="682" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="16" fill="#334155">递的是对象，就只有本仓库能加后端；递的是消息，任何语言都能写插件；递的是字符串，就得养一个解释器。</text>
  <text x="500" y="712" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" font-weight="700" fill="#0F172A">切在哪，决定了谁能扩展、能扩展什么、要付多少钱。</text>
</svg>